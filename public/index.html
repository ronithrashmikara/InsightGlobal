<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="InsightGlobal - A professional news aggregator with advanced filtering and bookmarking">
    <meta name="keywords" content="news, headlines, technology, business, sports, professional">
    <title>InsightGlobal - Precision News for the Global Professional</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div style="flex: 1;"></div>
                <div style="text-align: center; flex: 2;">
                    <div class="logo">InsightGlobal</div>
                    <p class="tagline">Precision News for the Global Professional</p>
                </div>
                <div style="flex: 1; display: flex; justify-content: flex-end;">
                    <button id="theme-toggle" class="theme-toggle">
                        <span class="theme-icon">🌙</span>
                    </button>
                </div>
            </div>
        </header>

        <div class="nav-tabs" id="category-tabs">
            <!-- Tabs will be dynamically generated -->
        </div>

        <div class="search-section">
            <div class="search-input-group">
                <label for="keyword">Keyword</label>
                <input type="text" id="keyword" placeholder="e.g., AI, Climate, Election...">
            </div>
            <div class="search-input-group">
                <label for="source">Source</label>
                <input type="text" id="source" placeholder="e.g., bbc-news, techcrunch...">
            </div>
            <div class="search-input-group">
                <label for="country">Country</label>
                <select id="country">
                    <!-- Countries will be dynamically generated -->
                </select>
            </div>
            <div class="search-input-group">
                <label for="sortBy">Sort By</label>
                <select id="sortBy">
                    <option value="publishedAt">Latest</option>
                    <option value="relevancy">Relevance</option>
                    <option value="popularity">Popularity</option>
                </select>
            </div>
            <div class="search-button-group">
                <button class="btn" onclick="searchNews()">🔍 Search</button>
                <button class="btn btn-secondary" onclick="clearSearch()">🗑️ Clear</button>
            </div>
        </div>

        <div id="content"></div>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/bookmarks.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
